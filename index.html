<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Pulse – NIET events</title>
<script>(function(){var r=document.documentElement,g=function(k){try{return localStorage.getItem(k)}catch(e){return null}};r.dataset.p=g('cp_p')||'indigo';r.dataset.m=g('cp_m')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')})()</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f1fa;--surf:#fff;--ink:#15142b;--mute:#62607e;--line:#dedcf0;--brand:#2b2bdb;--onbrand:#fff;--sun:#ffb81c;--ok:#0f9d6b;--bad:#d6402e;--stubink:#fff;
--Tech:#2b2bdb;--Cultural:#d92d65;--Sports:#0c8559;--Career:#a86800;--Workshop:#7a3ff2;--Club:#0a769f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-p=sunset]{--bg:#fdf3ec;--ink:#2a1710;--mute:#7a5c4d;--line:#f0d9cb;--brand:#c93f08;--sun:#ffc933}
:root[data-p=forest]{--bg:#eef6f1;--ink:#10241a;--mute:#55705f;--line:#d3e6da;--brand:#137a52;--sun:#f2c14e}
:root[data-p=mono]{--bg:#f3f3f1;--ink:#161616;--mute:#6a6a66;--line:#dcdcd6;--brand:#1f1f1f;--sun:#ffe14a}
:root[data-m=dark]{--bg:#0e0d1f;--surf:#1a1932;--ink:#f1f0ff;--mute:#a09ec4;--line:#2e2c52;--brand:#8c8cff;--onbrand:#0e0d1f;--stubink:#0e0d1f;--bad:#ff7a69;
--Tech:#8c8cff;--Cultural:#ff7aa5;--Sports:#3fd9a0;--Career:#ffc247;--Workshop:#b794ff;--Club:#5ccbf5;color-scheme:dark}
:root[data-m=dark][data-p=sunset]{--bg:#1c1010;--surf:#2a1816;--ink:#fff1ea;--mute:#c9a595;--line:#4a2b25;--brand:#ff8a5c;--onbrand:#1c1010}
:root[data-m=dark][data-p=forest]{--bg:#0b1712;--surf:#132a20;--ink:#e8f7ee;--mute:#8fb5a0;--line:#21402f;--brand:#4fd699;--onbrand:#0b1712}
:root[data-m=dark][data-p=mono]{--bg:#111;--surf:#1c1c1c;--ink:#f2f2f0;--mute:#a0a09a;--line:#333;--brand:#f2f2f0;--onbrand:#111}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Instrument Sans',system-ui,sans-serif;padding-bottom:84px;transition:background .25s,color .25s}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0}
.logo{font:800 22px 'Bricolage Grotesque';display:flex;align-items:center;gap:8px}
.logo i{width:16px;height:16px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px var(--brand)}
nav.d{display:none;gap:6px}
nav button{background:none;border:0;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--mute)}
nav.d button[aria-current=page]{background:var(--brand);color:var(--onbrand)}
.badge{background:var(--sun);color:#15142b;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:4px;font-weight:700}
.tools{display:flex;align-items:center;gap:6px;background:var(--surf);border:2px solid var(--line);border-radius:99px;padding:4px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--surf);background:var(--c);padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.theme{background:none;border:0;width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;padding:0}
.hero{background:var(--brand);color:var(--onbrand);border-radius:28px;padding:34px 26px;position:relative;overflow:hidden;margin-bottom:22px}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:800;max-width:11ch}
.hero p{max-width:44ch;opacity:.9;margin:12px 0 22px}
.hero .next{display:inline-flex;gap:12px;align-items:center;background:var(--sun);color:#15142b;border:0;border-radius:16px;padding:12px 16px;text-align:left;font-weight:600;position:relative;z-index:1}
.hero .next b{font:800 26px 'Bricolage Grotesque'}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:34px solid color-mix(in srgb,var(--sun) 55%,transparent)}
.search{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search input[type=search]{flex:1;min-width:200px;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surf)}
.search input[type=date]{padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surf)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chip{white-space:nowrap;border:2px solid var(--line);background:var(--surf);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--mute);margin:6px 0 14px;font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surf);border-radius:20px;display:flex;overflow:hidden;border:1px solid var(--line);position:relative;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--cc)}
.card.past{opacity:.6}
.open{display:flex;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.stub{width:84px;flex:none;background:var(--cc);color:var(--stubink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border-right:2px dashed var(--surf)}
.stub b{font:800 34px/1 'Bricolage Grotesque'}.stub span{font-size:13px;font-weight:600}
.cb{padding:14px 44px 14px 16px;flex:1;min-width:0}
.cat{font-size:13px;font-weight:600;color:var(--cc)}
.card h3{font-size:20px;margin:3px 0 8px}
.meta{color:var(--mute);font-size:14px}
.left{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--ok)}.left.low{color:var(--bad)}.left.end{color:var(--mute)}
.heart{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:19px;line-height:1;color:var(--mute)}
.heart[aria-pressed=true]{color:#e0356b;background:#ffe3ec}
.empty{text-align:center;padding:50px 10px;color:var(--mute);grid-column:1/-1}
.empty b{display:block;color:var(--ink);font:700 22px 'Bricolage Grotesque';margin-bottom:6px}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:14px;padding:13px 20px;font-weight:700;width:100%}
.btn.alt{background:var(--bg);color:var(--ink);border:2px solid var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}
.ov{position:fixed;inset:0;background:rgba(10,9,30,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.on{display:flex}
.sheet{background:var(--surf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:0 0 calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{background:var(--cc);color:var(--stubink);padding:22px 22px 20px;position:relative}
.sh h2{font-size:30px;margin-top:6px;padding-right:40px}.sh .cat{color:inherit;opacity:.9}
.x{position:absolute;right:14px;top:14px;border:0;background:rgba(128,128,128,.3);color:inherit;width:36px;height:36px;border-radius:50%;font-size:18px}
.sb{padding:18px 22px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.facts div{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px}.facts small{display:block;color:var(--mute)}
.tl{list-style:none;margin:8px 0 18px;padding:0 0 0 14px;border-left:3px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 14px}.tl li:before{content:"";position:absolute;left:-23px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--cc)}
.tl b{font-size:14px;display:block}
.row{display:flex;gap:10px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.f{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.f[aria-invalid=true]{border-color:var(--bad)}.err{color:var(--bad);font-size:13px;min-height:16px}
.ok{text-align:center;padding:6px 0}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);margin:0 auto 10px;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.tick svg{width:34px;stroke:#fff;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.pass{display:flex;background:var(--bg);border-radius:18px;text-align:left;margin:14px 0;overflow:hidden;border:1px solid var(--line)}
.pass .l{padding:14px;flex:1}.pass .r{padding:12px;border-left:2px dashed var(--line);display:grid;place-items:center}
.pass svg{width:76px;height:76px;fill:var(--ink)}.code{font:800 22px 'Bricolage Grotesque';letter-spacing:.06em;color:var(--brand)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
nav.m{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav.m button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;border-radius:14px;padding:6px 18px}
nav.m button[aria-current=page]{color:var(--brand)}nav.m svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:760px){nav.d{display:flex}nav.m{display:none}body{padding-bottom:30px}.ov{align-items:center}.sheet{border-radius:26px}.toast{bottom:30px}}
.vibe{display:flex;gap:8px;align-items:center;overflow-x:auto;margin-bottom:12px;padding:2px;scrollbar-width:none}.vibe span{font:700 16px 'Bricolage Grotesque';white-space:nowrap;margin-right:2px}.vb[aria-pressed=true]{background:var(--sun);color:#15142b;border-color:var(--sun)}.sur{border-style:dashed}
.bar{height:5px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cc);border-radius:9px}.hotb{margin-left:8px;font-size:12px;background:var(--sun);color:#15142b;border-radius:99px;padding:1px 8px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60}.conf i{position:absolute;left:50%;top:55%;width:9px;height:14px;border-radius:2px;animation:cf 1.5s cubic-bezier(.2,.7,.3,1) forwards}@keyframes cf{40%{transform:translate(calc(var(--x)*.7),var(--y)) rotate(calc(var(--r)*.5))}100%{transform:translate(var(--x),380px) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

${nx?`<button class="next" data-open="${nx.id}"><b id="cd" data-t="${nx.date.getTime()}">${cdText(nx.date.getTime())}</b><span>${esc(nx.t)}<br><small>${fmtT(nx.date)} · ${esc(nx.v)}</small></span></button>`:''}<span class="cap">NIET Greater Noida</span></section>

<div class="search"><input type="search" id="q" placeholder="Search events, venues, clubs" aria-label="Search events" value="${esc(st.q)}"><input type="date" id="dt" aria-label="Pick a date" value="${st.date}"></div>
<div class="chips" role="group" aria-label="Category">${['All',...CAT].map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${st.cat==c}">${c}</button>`).join('')}</div>
<div class="chips" role="group" aria-label="Date">${['Any','Today','This week','This month'].map(w=>`<button class="chip" data-when="${w}" aria-pressed="${!st.date&&st.when==w}">${w=='Any'?'Any date':w}</button>`).join('')}</div>
<div class="count" id="cnt" aria-live="polite">${list.length} event${list.length==1?'':'s'}</div>
<div class="grid" id="grid">${list.length?list.map(card).join(''):noMatch}</div>`}
function listView(ids,title,empt){const list=E.filter(e=>ids.includes(e.id)).sort((a,b)=>a.date-b.date);
return `<h2 style="font-size:36px;margin:10px 0 18px">${title}</h2><div class="grid">${list.length?list.map(card).join(''):`<div class="empty"><b>${empt[0]}</b>${empt[1]}<br><br><button class="chip" data-v="discover">Browse events</button></div>`}</div>`}
function render(){if(!user){authView();return}document.body.classList.remove('anon');nav();$('#app').innerHTML=st.view=='manage'&&user.role=='org'?manageView():st.view=='saved'?listView(saved,'Saved events',['Nothing saved yet','Tap the heart on any event to keep it here.']):st.view=='tickets'?listView(Object.keys(regs),'My tickets',['No tickets yet','Reserve a seat and your pass will show up here.']):discover()}
function refreshGrid(){const list=E.filter(match).sort((a,b)=>a.date-b.date);$('#cnt').textContent=list.length+' event'+(list.length==1?'':'s');$('#grid').innerHTML=list.length?list.map(card).join(''):noMatch}
function qr(code){let h=0,s='';for(const c of code)h=(h*31+c.charCodeAt(0))>>>0;
for(let y=0;y<9;y++)for(let x=0;x<9;x++){const f=(x<3&&y<3)||(x>5&&y<3)||(x<3&&y>5);h=(h*1103515245+12345)>>>0;if(f||(h>>16)&1)s+=`<rect x="${x*10}" y="${y*10}" width="10" height="10"/>`}
return `<svg viewBox="0 0 90 90" aria-label="Ticket code">${s}</svg>`}
function code(e,n){let h=0;for(const c of e.id+n)h=(h*37+c.charCodeAt(0))>>>0;return 'CP-'+h.toString(36).toUpperCase().slice(0,5).padEnd(5,'X')}
function pass(e){const r=regs[e.id];return `<div class="pass"><div class="l"><div class="cat" style="color:var(--brand)">Your pass</div><b>${esc(e.t)}</b><div class="meta">${fmtD(e.date)}, ${fmtT(e.date)}<br>${esc(e.v)}<br>${esc(r.name)}</div><div class="code">${r.code}</div></div><div class="r">${qr(r.code)}</div></div>`}
function open(id){const e=E.find(x=>x.id==id);if(!e)return;const l=left(e),on=saved.includes(id),en=ended(e);
if(!$('#ov').classList.contains('on'))lastF=document.activeElement;
$('#sheet').innerHTML=`<div class="sh" style="--cc:var(--${e.c})"><button class="x" data-close aria-label="Close">✕</button><div class="cat">${e.c} · by ${esc(e.o)}</div><h2>${esc(e.t)}</h2></div>
<div class="sb" style="--cc:var(--${e.c})"><div class="facts"><div><small>When</small>${fmtD(e.date)}<br>${fmtT(e.date)}</div><div><small>Where</small>${esc(e.v)}<br>NIET Campus</div><div><small>Seats</small>${regs[id]?'You’re in':l<=0?'Full':l+' of '+e.cap+' left'}</div><div><small>Cost</small>Free for students</div></div>
<p>${esc(e.desc)}</p><h3 style="font-size:19px">Schedule</h3><ul class="tl">${e.s.map(s=>`<li><b>${esc(s[0])}</b>${esc(s[1])}</li>`).join('')}</ul>
<div id="act">${regs[id]?pass(e)+'<button class="btn alt" data-cancel="'+id+'">Cancel registration</button>':`<div class="row"><button class="btn" data-reg="${id}" ${l<=0||en?'disabled':''}>${en?'Event ended':l<=0?'Event full':'Reserve my spot'}</button><button class="btn alt" style="width:auto" data-save="${id}" aria-pressed="${on}">${on?'♥ Saved':'♡ Save'}</button></div>`}</div></div>`;
if(user.role=='org')$('#act').innerHTML=`<p class="meta">Organizer view: students reserve seats from their own login.</p>${e.owner==user.email?`<button class="btn alt" data-del="${e.id}">${pendDel==e.id?'Tap again to delete':'Delete this event'}</button>`:''}`;
$('#ov').classList.add('on');document.body.style.overflow='hidden';$('#sheet').scrollTop=0;$('.x').focus()}
function close(){$('#ov').classList.remove('on');document.body.style.overflow='';if(location.hash)history.replaceState(null,'',location.pathname);if(lastF&&lastF.isConnected)lastF.focus();lastF=null}
function form(id){$('#act').innerHTML=`<form id="rf" novalidate><label for="nm">Full name</label><input class="f" id="nm" autocomplete="name" value="${esc(me.name||'')}"><div class="err" id="e1"></div>
<label for="em">College email</label><input class="f" id="em" type="email" autocomplete="email" value="${esc(me.email||'')}"><div class="err" id="e2"></div>
<label for="rl">Roll number</label><input class="f" id="rl" inputmode="numeric" value="${esc(me.roll||'')}"><div class="err" id="e3"></div>
<button class="btn" type="submit" style="margin-top:10px">Confirm registration</button></form>`;
$('#nm').focus();$('#rf').onsubmit=ev=>{ev.preventDefault();const n=$('#nm'),m=$('#em'),r=$('#rl');
const chk=[[n,'e1',n.value.trim().length>=2,'Enter your full name.'],[m,'e2',/^\S+@\S+\.\S+$/.test(m.value.trim()),'Enter a valid email, like name@niet.co.in.'],[r,'e3',/^\d{5,}$/.test(r.value.trim()),'Roll number should be at least 5 digits.']];
let ok=true;chk.forEach(([i,e,v,msg])=>{i.setAttribute('aria-invalid',!v);$('#'+e).textContent=v?'':msg;if(!v)ok=false});if(!ok){chk.find(c=>!c[2])[0].focus();return}
me={name:n.value.trim(),email:m.value.trim(),roll:r.value.trim()};
const ev2=E.find(x=>x.id==id);regs[id]={...me,code:code(ev2,me.roll)};store();
$('#act').innerHTML=`<div class="ok"><div class="tick"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></div><h3 style="font-size:26px">You’re in!</h3><p class="meta">A confirmation is saved under My tickets. Show this pass at the entrance.</p></div>${pass(ev2)}<button class="btn alt" data-close>Done</button>`;
burst();nav();if(st.view!='discover')render();else refreshGrid()}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}

async function hp(e,p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cp1:'+e+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(x){return'p:'+btoa(unescape(encodeURIComponent(p)))}}
function login(u){user=u;sess=u.email;ls.set('cp_sess',u.email);saved=ls.get(uk('cp_saved'),[]);regs=ls.get(uk('cp_regs'),{});me={name:u.name,email:u.email,roll:u.roll||''};st={q:'',cat:'All',when:'Any',date:'',view:'discover',vibe:''};loadCustom();render();scrollTo(0,0)}
function logout(){close();user=null;sess=null;ls.set('cp_sess',null);saved=[];regs={};me={};authMode='in';loadCustom();render()}
function authView(){document.body.classList.add('anon');$('#who').innerHTML='';$('nav.d').innerHTML='';$('nav.m').innerHTML='';
const up=authMode=='up',org=authRole=='org';
$('#app').innerHTML=`<section class="hero"><h1>Log in to Campus Pulse</h1><p>Students save events and reserve seats. Organizers publish events for the campus.</p></section>
<div class="authbox"><div class="seg" role="tablist" aria-label="Account type"><button role="tab" data-arole="stu" aria-selected="${!org}">🎓 Student</button><button role="tab" data-arole="org" aria-selected="${org}">📣 Organizer</button></div>
<form id="af" novalidate><h2 style="font-size:24px;margin-top:16px">${up?'Create '+(org?'organizer':'student')+' account':(org?'Organizer':'Student')+' login'}</h2>
${up?`<label for="an">Full name</label><input class="f" id="an" autocomplete="name"><div class="err" id="a1"></div>`:''}
<label for="ae">Email</label><input class="f" id="ae" type="email" autocomplete="email"><div class="err" id="a2"></div>
${up&&!org?`<label for="ar">Roll number</label><input class="f" id="ar" inputmode="numeric"><div class="err" id="a3"></div>`:''}
${up&&org?`<label for="ac">Club or department</label><input class="f" id="ac"><div class="err" id="a3"></div><label for="ak">Organizer access code</label><input class="f" id="ak" autocomplete="off"><div class="err" id="a4"></div>`:''}
<label for="ap">Password</label><input class="f" id="ap" type="password" autocomplete="${up?'new-password':'current-password'}"><div class="err" id="a5"></div>
<div class="err" id="aerr" role="alert"></div>
<button class="btn" type="submit" style="margin-top:6px">${up?'Create account':'Log in'}</button></form>
<p class="meta" style="text-align:center;margin:14px 0 0">${up?'Already have an account?':'New here?'} <button class="link" data-amode>${up?'Log in':'Create an account'}</button></p>
<p class="meta" style="font-size:12px;text-align:center;margin:10px 0 0">Demo sign-in: accounts are stored in this browser only.</p></div>`}
async function authSubmit(){const up=authMode=='up',org=authRole=='org',g=i=>$('#'+i)?$('#'+i).value.trim():'',set=(i,m)=>{$('#'+i).textContent=m};
['a1','a2','a3','a4','a5','aerr'].forEach(i=>{if($('#'+i))set(i,'')});
const name=g('an'),email=g('ae').toLowerCase(),pw=$('#ap').value,roll=g('ar'),club=g('ac'),cd=g('ak');let bad=false;
if(up&&name.length<2){set('a1','Enter your full name.');bad=true}
if(!/^\S+@\S+\.\S+$/.test(email)){set('a2','Enter a valid email.');bad=true}
if(up&&!org&&!/^\d{5,}$/.test(roll)){set('a3','Roll number should be at least 5 digits.');bad=true}
if(up&&org&&club.length<2){set('a3','Enter your club or department.');bad=true}
if(up&&org&&cd!==ORG_CODE){set('a4','That organizer code isn’t right.');bad=true}
if(pw.length<(up?6:1)){set('a5',up?'Use at least 6 characters.':'Enter your password.');bad=true}
if(bad)return;const h=await hp(email,pw);
if(up){if(users[email]){set('aerr','An account with this email already exists. Log in instead.');return}
users[email]={email,name,role:org?'org':'stu',h,...(org?{club}:{roll})};ls.set('cp_users',users);login(users[email])}
else{const u=users[email];if(!u||u.h!==h){set('aerr','Email or password is incorrect.');return}
if(u.role!==authRole){set('aerr','This is '+(u.role=='org'?'an Organizer':'a Student')+' account. Switch the tab above.');return}login(u)}}
function manageView(){const mine=E.filter(e=>e.owner==user.email).sort((a,b)=>a.date-b.date),today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
return `<h2 style="font-size:36px;margin:10px 0 6px">Manage events</h2><p class="meta" style="margin:0 0 18px">Publishing as ${esc(user.club)}. New events appear on Discover right away.</p>
<form id="ef" class="mf" novalidate><div class="wide"><label for="et">Event title</label><input class="f" id="et"><div class="err" id="m1"></div></div>
<div><label for="ec">Category</label><select class="f" id="ec">${CAT.map(c=>`<option>${c}</option>`).join('')}</select></div>
<div><label for="ev">Venue</label><input class="f" id="ev"><div class="err" id="m3"></div></div>
<div><label for="ed">Date</label><input class="f" id="ed" type="date" min="${today}"></div>
<div><label for="eh">Start time</label><input class="f" id="eh" type="time"><div class="err" id="m2"></div></div>
<div><label for="ek">Seats</label><input class="f" id="ek" type="number" min="1" max="5000" value="50"><div class="err" id="m4"></div></div>
<div class="wide"><label for="eo">Description</label><textarea class="f" id="eo"></textarea></div>
<div class="wide"><button class="btn" type="submit" style="margin-top:10px">Publish event</button></div></form>
<h3 style="font-size:24px;margin:0 0 14px">Your events (${mine.length})</h3><div class="grid">${mine.length?mine.map(card).join(''):'<div class="empty"><b>No events yet</b>Fill in the form above to publish your first one.</div>'}</div>`}
function addEvent(){const g=i=>$('#'+i).value.trim();['m1','m2','m3','m4'].forEach(i=>$('#'+i).textContent='');
const t=g('et'),c=g('ec'),d=g('ed'),tm=g('eh'),v=g('ev'),cap=+g('ek'),ds=g('eo');let bad=false;
if(t.length<3){$('#m1').textContent='Give the event a title.';bad=true}
const dt=new Date(d+'T'+tm);if(!d||!tm||isNaN(dt)||dt<new Date()){$('#m2').textContent='Pick a future date and time.';bad=true}
if(v.length<2){$('#m3').textContent='Add a venue.';bad=true}
if(!(cap>=1&&cap<=5000)){$('#m4').textContent='Seats must be 1–5000.';bad=true}
if(bad)return;
custom.push({id:'u'+Date.now().toString(36),t,c,v,cap,tk:0,o:user.club,owner:user.email,desc:ds||'Details coming soon.',s:[[tm,'Event starts']],iso:dt.toISOString()});
ls.set('cp_events',custom);loadCustom();toast('Event published');render()}
function delEvent(id){if(pendDel!=id){pendDel=id;toast('Tap delete again to confirm');open(id);return}
pendDel='';custom=custom.filter(c=>c.id!=id||c.owner!=user.email);ls.set('cp_events',custom);loadCustom();close();render();toast('Event deleted')}
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id=='af')authSubmit();if(ev.target.id=='ef')addEvent()});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-open],[data-save],[data-vibe],[data-surprise],[data-cat],[data-when],[data-v],[data-close],[data-reg],[data-cancel],[data-clear],[data-pal],[data-mode],[data-arole],[data-amode],[data-logout],[data-del]');
if(!t){if(ev.target.id=='ov')close();return}const d=t.dataset,sheet=$('#ov').classList.contains('on');
if(d.arole){authRole=d.arole;render()}else if(d.amode!==undefined){authMode=authMode=='in'?'up':'in';render()}else if(d.logout!==undefined){logout()}else if(d.del){delEvent(d.del)}
else if(d.pal)setTheme(d.pal);
else if(d.mode!==undefined)setTheme(null,R.dataset.m=='dark'?'light':'dark');
else if(d.open){history.replaceState(null,'','#'+d.open);open(d.open)}
else if(d.save!==undefined){const i=saved.indexOf(d.save);i<0?(saved.push(d.save),toast('Saved to your list')):(saved.splice(i,1),toast('Removed from saved'));store();
if(sheet)open(d.save);else if(st.view=='discover')refreshGrid();else render();nav()}
else if(d.vibe){st.vibe=st.vibe==d.vibe?'':d.vibe;render()}
else if(d.surprise!==undefined){const a=E.filter(e=>left(e)>0&&!ended(e));if(!a.length){toast('Nothing open right now');return}const p=a[Math.random()*a.length|0];history.replaceState(null,'','#'+p.id);open(p.id)}
else if(d.cat){st.cat=d.cat;render()}else if(d.when){st.when=d.when;st.date='';render()}
else if(d.v){st.view=d.v;close();render();scrollTo(0,0)}
else if(d.close!==undefined){close()}
else if(d.reg)form(d.reg);
else if(d.cancel){delete regs[d.cancel];store();toast('Registration cancelled');open(d.cancel);nav();if(st.view!='discover')render();else refreshGrid()}
else if(d.clear!==undefined){st={...st,q:'',cat:'All',when:'Any',date:'',vibe:''};render()}});
document.addEventListener('input',ev=>{if(ev.target.id=='q'){st.q=ev.target.value;refreshGrid()}if(ev.target.id=='dt'){st.date=ev.target.value;document.querySelectorAll('[data-when]').forEach(b=>b.setAttribute('aria-pressed','false'));refreshGrid()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape'&&$('#ov').classList.contains('on'))close()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(user&&E.some(e=>e.id==h))open(h)});
function cdText(t){let m=Math.max(0,Math.round((t-Date.now())/6e4));const d=Math.floor(m/1440),h=Math.floor(m%1440/60);m%=60;return 'starts in '+(d?d+'d '+h+'h':h?h+'h '+m+'m':m+'m')}
function burst(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('div');c.className='conf';c.setAttribute('aria-hidden','true');const cols=['#ffb81c','#e0356b','#2b2bdb','#0f9d6b','#7a3ff2'];for(let i=0;i<46;i++){const p=document.createElement('i');p.style.cssText=`--x:${(Math.random()-.5)*620}px;--y:${-180-Math.random()*280}px;--r:${Math.random()*720}deg;background:${cols[i%5]}`;c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),1700)}
setInterval(()=>{const el=$('#cd');if(el)el.textContent=cdText(+el.dataset.t)},30000);
themeUI();if(sess&&users[sess])login(users[sess]);else render();if(user&&E.some(e=>e.id==location.hash.slice(1)))open(location.hash.slice(1));
</script></body></html>
